<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BomberMarv - Multiplayer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2a2a2a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            position: relative;
            background: #3c3c3c;
            border: 2px solid #666;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .game-canvas {
            display: block;
            border-radius: 6px;
        }
        
        .connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        
        .connected {
            background: #4CAF50;
        }
        
        .disconnected {
            background: #f44336;
        }
        
        .connecting {
            background: #ff9800;
        }
        
        .controls-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }
        
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
                gap: 10px;
            }
            
            .control-btn {
                width: 60px;
                height: 60px;
                background: rgba(255, 255, 255, 0.1);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                color: white;
                font-weight: bold;
                font-size: 18px;
                touch-action: manipulation;
                user-select: none;
            }
            
            .control-btn:active {
                background: rgba(255, 255, 255, 0.3);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
